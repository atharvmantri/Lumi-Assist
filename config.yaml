# Lumi configuration — safe defaults for a fresh Windows install.
# install.bat writes machine-specific overrides to config.local.yaml.

lumi:
  wake_word: "hey lumi"
  wake_word_sensitivity: 0.5

stt:
  model: "small"              # CPU-friendly default; installer upgrades GPU machines
  device: "cpu"
  compute_type: "int8"
  silence_threshold_ms: 1500
  language: null              # null = auto-detect

llm:
  provider: "hackclub"
  api_key_env: "HACKCLUB_API_KEY"
  model: "openrouter/free"
  base_url: "https://ai.hackclub.com/proxy/v1"
  max_tokens: 2048
  temperature: 0.7
  system_prompt_path: "prompts/system.md"
  history_turns: 20

tts:
  engine: "piper"
  voice: "en_GB-southern_english_female-low"
  device: "cpu"
  speed: 1.0

ui:
  theme: "dark"
  opacity: 0.88
  always_on_top: true
  show_transcript: true
  window_position: [80, 80]

audio:
  input_device: "default"
  output_device: "default"
  sample_rate: 16000
